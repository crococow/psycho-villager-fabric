# Builds the mod and publishes the .jar to GitHub Releases.
# Runs on every push to main: the release tag is v<version> from gradle.properties.
# Bump `version` in gradle.properties to publish a new release; otherwise the
# existing release for the current version gets the freshly built .jar.

name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: read version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Psycho Villagers v${{ steps.version.outputs.version }} (Fabric 26.3)
          make_latest: true
          body: |
            Hidden psychos among villagers. Fabric mod for Minecraft 26.3.

            **Requirements:** Fabric Loader 0.20.1+, Fabric API 0.165.0+26.3, Java 25.
            Put the `.jar` into your `mods/` folder.
          files: build/libs/psychovillagers-fabric-*.jar
          fail_on_unmatched_files: true
          overwrite_files: true
